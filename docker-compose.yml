# =============================================================================
# AegisSOC Multi-Container Production Infrastructure
# Orchestrates FastAPI SOC Backend, PostgreSQL 16 database, volumes & networking
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database Service
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: aegissoc_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-aegissoc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_postgres.sql:/docker-entrypoint-initdb.d/init_postgres.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-aegissoc}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - aegis-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # 2. AegisSOC FastAPI Backend Service
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aegissoc-backend:latest
    container_name: aegissoc_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Application Core
      APP_NAME: "AegisSOC Platform API"
      APP_ENV: ${APP_ENV:-production}
      DEBUG: ${DEBUG:-false}
      API_V1_STR: "/api"
      SECRET_KEY: ${SECRET_KEY:-aegissoc_production_jwt_signing_secret_key_32_bytes_min!}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}

      # Database Connection (Routed to PostgreSQL service)
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_pass}@db:5432/${POSTGRES_DB:-aegissoc}

      # CORS & Host Boundaries
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8000,http://127.0.0.1:3000,http://127.0.0.1:8000}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}

      # Threat Intelligence & AI Settings
      SIMULATE_ML_ENGINE: ${SIMULATE_ML_ENGINE:-false}
      SIMULATE_THREAT_INTEL: ${SIMULATE_THREAT_INTEL:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VIRUSTOTAL_API_KEY: ${VIRUSTOTAL_API_KEY:-}
      ABUSEIPDB_API_KEY: ${ABUSEIPDB_API_KEY:-}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').getcode() == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - aegis-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

# -----------------------------------------------------------------------------
# Persistent Volumes
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
    name: aegissoc_postgres_data
    driver: local

# -----------------------------------------------------------------------------
# Isolated Service Network
# -----------------------------------------------------------------------------
networks:
  aegis-network:
    name: aegissoc_network
    driver: bridge

# =============================================================================
# AegisSOC Render Blueprint Configuration (100% Free Tier)
# =============================================================================
services:
  - type: web
    name: aegissoc
    runtime: docker
    dockerContext: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./aegissoc.db
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: DEFAULT_AI_PROVIDER
        value: gemini
      - key: GEMINI_API_KEY
        sync: false
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: ABUSEIPDB_API_KEY
        sync: false
